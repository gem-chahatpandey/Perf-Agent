name: Endpoint Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  endpoint-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install impact agent dependencies
        run: python -m pip install -r ci/impact-agent/requirements.txt

      - name: Analyze endpoint impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python ci/impact-agent/main.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output endpoint-impact.json

      - name: Upload endpoint impact report
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-impact
          path: endpoint-impact.json

      - name: Comment endpoint impact on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('endpoint-impact.json', 'utf8'));
            const marker = '<!-- endpoint-impact-agent -->';
            const body = `${marker}\n${report.markdown_summary}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }